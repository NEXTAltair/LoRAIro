name: Portable development tasks

on:
  pull_request:
    paths:
      - Makefile
      - scripts/dev_tasks.py
      - scripts/generate_ui.py
      - scripts/safe_cleanup.py
      - scripts/tests/**
      - .devcontainer/Dockerfile
      - .devcontainer/devcontainer.json
      - .devcontainer/postCreateCommand.sh
      - .devcontainer/README.md
      - .github/workflows/dev-tasks.yml
  push:
    branches: [main]
    paths:
      - Makefile
      - scripts/dev_tasks.py
      - scripts/generate_ui.py
      - scripts/safe_cleanup.py
      - scripts/tests/**
      - .devcontainer/Dockerfile
      - .devcontainer/devcontainer.json
      - .devcontainer/postCreateCommand.sh
      - .devcontainer/README.md
      - .github/workflows/dev-tasks.yml

permissions:
  contents: read

jobs:
  portable-tasks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore pinned runtime for the shared script test suite
        run: python -X utf8 scripts/install_agent_harness.py
      - name: Test task planning and worktree isolation without syncing environments
        run: |
          bash -n .devcontainer/postCreateCommand.sh
          python -m pip install pytest
          python -X utf8 -m pytest scripts/tests -q -o addopts=''
